<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
    
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="converter-container">
    <header class="converter-header">
      <h1>Currency Converter</h1>
    </header>

    <form id="converter-form" onsubmit="return false;">
      <div class="form-group">
        <label for="amount">Enter amount</label>
        <input 
          type="number" 
          id="amount" 
          placeholder="100" 
          value="100" 
          required 
          min="0" 
          step="any"
        >
      </div>

      
      <div class="currency-selectors">
        <div class="form-group select-box">
          <label for="from-currency">From</label>
          <div class="dropdown-wrapper">
            <span id="from-flag" class="currency-flag">🏳️</span>
            <select id="from-currency" required>
              <option value="" disabled selected>Select Source</option>
              
            </select>
          </div>
        </div>

        <div class="conversion-bridge">
          <span class="bridge-text">TO</span>
        </div>

        <div class="form-group select-box">
          <label for="to-currency">To</label>
          <div class="dropdown-wrapper">
            <span id="to-flag" class="currency-flag">🏳️</span>
            <select id="to-currency" required>
              <option value="" disabled selected>Select Target</option>
              
            </select>
          </div>
        </div>
      </div>

      
      <button type="submit" id="convert-btn">Convert</button>
    </form>

    <div class="output-container">
      <p id="status" class=" hidden"></p>
      <p id="result-message" class="result-text hidden"></p>
      <p id="error-message" class="error-text hidden"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
